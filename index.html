<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Nuovi Modelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { height: 100vh; padding: 3.5vh 4vw; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--soft); font-weight: 700; letter-spacing: .12em; font-size: 1.6vh; text-transform: uppercase; }
  .pill { background: rgba(255,255,255,.08); padding: .8vh 1.4vw; border-radius: 99px; }
  .btn { background: var(--amber); color: #1a1205; font-weight: 800; padding: 1.6vh 2.6vw; border-radius: 14px; font-size: 2.2vh; box-shadow: 0 8px 24px rgba(245,158,11,.35); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { color: var(--soft); font-size: 1.5vh; margin-left: 1vw; }

  /* lobby */
  #lobby { flex: 1; display: grid; grid-template-columns: 1fr 1.15fr; gap: 4vw; align-items: center; }
  .join h1 { font-size: 7vh; line-height: 1; }
  .join p { color: var(--soft); font-size: 2.2vh; margin: 2vh 0 3vh; }
  .qrbox { display: flex; gap: 2.5vw; align-items: center; }
  .qrbox canvas { border-radius: 16px; background: #fff; padding: 10px; width: 28vh !important; height: 28vh !important; }
  .code { font-size: 1.8vh; color: var(--soft); }
  .code b { display: block; font-family: "Space Grotesk"; font-size: 9vh; color: #fff; letter-spacing: .08em; line-height: 1.1; }
  .url { font-size: 1.6vh; color: var(--soft); word-break: break-all; margin-top: 1vh; }
  .players { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 24px; padding: 3vh 2vw; height: 70vh; display: flex; flex-direction: column; }
  .players h2 { font-size: 3vh; display: flex; justify-content: space-between; }
  .chips { display: flex; flex-wrap: wrap; gap: 1vh; margin-top: 2vh; align-content: flex-start; overflow: hidden; flex: 1; }
  .chip { background: var(--card); padding: 1vh 1.4vw; border-radius: 99px; font-weight: 700; font-size: 2.1vh; animation: pop .45s ease-out; }

  /* domanda */
  #question, #reveal { flex: 1; display: flex; flex-direction: column; gap: 3vh; }
  .qhead { display: flex; align-items: center; gap: 2.5vw; margin-top: 2vh; }
  .ring { position: relative; width: 13vh; height: 13vh; flex: none; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: rgba(255,255,255,.1); } .ring .fg { stroke: var(--amber); stroke-linecap: round; transition: stroke .3s; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 4.6vh "Space Grotesk"; }
  .ring.low .fg { stroke: var(--ko); } .ring.low span { animation: pop .5s infinite; }
  .qtext { font-size: 4.3vh; line-height: 1.2; font-weight: 700; animation: rise .5s ease-out; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh 1.5vw; flex: 1; }
  .grid .opt { font-size: 2.9vh; padding: 2vh 1.8vw; animation: rise .5s ease-out backwards; }
  .grid .opt:nth-child(2) { animation-delay: .08s } .grid .opt:nth-child(3) { animation-delay: .16s } .grid .opt:nth-child(4) { animation-delay: .24s }
  .count { text-align: right; color: var(--soft); font-size: 2vh; font-weight: 700; }
  .count b { color: #fff; font-size: 3vh; }

  /* reveal */
  .opt .bar { position: absolute; left: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.75); border-radius: 0 0 0 var(--r); transition: width 1s cubic-bezier(.2,.8,.2,1); width: 0; }
  .opt .n { margin-left: auto; font: 700 3.4vh "Space Grotesk"; }
  .opt.wrong { opacity: .28; filter: grayscale(.6); transform: scale(.97); }
  .opt.right { animation: glow 1.4s ease-in-out infinite; transform: scale(1.02); outline: 4px solid #fff; }
  .opt.right::after { content: "✓"; position: absolute; top: -1.6vh; right: -1vw; background: var(--ok); width: 5vh; height: 5vh; border-radius: 50%; display: grid; place-items: center; font-size: 3vh; animation: pop .5s ease-out; }
  .why { background: rgba(255,255,255,.07); border-left: 6px solid var(--amber); border-radius: 14px; padding: 2vh 1.8vw; font-size: 2.3vh; line-height: 1.4; animation: rise .6s .4s ease-out backwards; }
  .why b { color: var(--amber); } .why small { display: block; color: var(--soft); font-size: 1.5vh; margin-top: .8vh; }

  /* classifica */
  #board { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; }
  #board h1 { font-size: 6vh; }
  .rows { width: min(1100px, 80vw); display: flex; flex-direction: column; gap: 1.4vh; }
  .row { display: grid; grid-template-columns: 6vh 1fr auto auto; align-items: center; gap: 1.5vw; background: var(--card); border-radius: 16px; padding: 1.6vh 1.6vw; font-size: 2.8vh; font-weight: 700; animation: rise .5s ease-out backwards; position: relative; overflow: hidden; }
  .row .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(245,158,11,.22), rgba(245,158,11,.04)); width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .row > *:not(.fill) { position: relative; }
  .rk { font: 700 3.2vh "Space Grotesk"; color: var(--amber); }
  .gain { color: var(--ok); font-size: 2.2vh; }
  .streak { font-size: 1.8vh; background: rgba(245,158,11,.18); color: var(--amber); padding: .4vh .8vw; border-radius: 99px; }

  /* podio */
  #end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3vh; padding-bottom: 4vh; }
  #end h1 { font-size: 7vh; position: absolute; top: 8vh; }
  .podium { display: flex; align-items: flex-end; gap: 2vw; }
  .step { width: 18vw; text-align: center; }
  .step .name { font: 700 3.4vh "Space Grotesk"; margin-bottom: 1vh; animation: pop .6s ease-out backwards; }
  .step .pts { color: var(--soft); font-size: 2vh; margin-bottom: 1vh; }
  .step .block { border-radius: 18px 18px 0 0; display: grid; place-items: start center; padding-top: 2vh; font: 700 8vh "Space Grotesk"; color: rgba(255,255,255,.9); transform-origin: bottom; animation: grow .9s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes grow { from { transform: scaleY(0) } }
  .s1 .block { height: 34vh; background: linear-gradient(#f59e0b, #b45309); } .s2 .block { height: 25vh; background: linear-gradient(#94a3b8, #475569); } .s3 .block { height: 18vh; background: linear-gradient(#d97706, #7c2d12); }
  .s2 .block, .s2 .name { animation-delay: .5s } .s3 .block, .s3 .name { animation-delay: 0s } .s1 .block, .s1 .name { animation-delay: 1.1s }
</style>
</head>
<body>
<main>
  <div class="top"><span class="pill">Gruppo 8 · I nuovi modelli economici</span><span id="status" class="pill">Collegamento…</span></div>

  <section id="lobby">
    <div class="join">
      <h1>Sfida finale</h1>
      <p>Inquadra il QR con il telefono, scegli un nickname e aspetta l'inizio.</p>
      <div class="qrbox"><canvas id="qr"></canvas><div class="code">Codice partita<b id="code">----</b><div id="url" class="url"></div></div></div>
      <div style="margin-top:4vh"><button class="btn" id="start">Inizia il quiz</button><span class="hint">oppure Spazio</span></div>
    </div>
    <div class="players"><h2>Giocatori <span id="pcount">0</span></h2><div class="chips" id="chips"></div></div>
  </section>

  <section id="question" class="hidden">
    <div class="qhead"><div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="arc" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><span id="secs">25</span></div><div class="qtext" id="qtext"></div></div>
    <div class="grid" id="qgrid"></div>
    <div class="count"><b id="acount">0</b> / <span id="ptot">0</span> risposte</div>
  </section>

  <section id="reveal" class="hidden">
    <div class="qtext" id="rtext" style="font-size:3.4vh;margin-top:2vh"></div>
    <div class="grid" id="rgrid"></div>
    <div class="why" id="why"></div>
    <div><button class="btn" id="toBoard">Classifica</button><span class="hint">Spazio</span></div>
  </section>

  <section id="board" class="hidden">
    <h1 id="btitle">Classifica</h1>
    <div class="rows" id="rows"></div>
    <div><button class="btn" id="next">Prossima domanda</button><span class="hint">Spazio</span></div>
  </section>

  <section id="end" class="hidden">
    <h1>Il podio</h1>
    <div class="podium" id="podium"></div>
  </section>
</main>

<script type="module">
import confetti from "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/+esm";
import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm";
import { room, shape, esc, $ } from "./common.js";
import { QUESTIONS, SECONDS } from "./questions.js";

// Stato salvato: un refresh del proiettore non perde punteggi
const saved = (() => { try { return JSON.parse(localStorage.getItem("quiz-host")) } catch { return null } })();
const S = saved && Date.now() - saved.at < 6 * 3600e3 ? saved : { code: String(Math.floor(1000 + Math.random() * 9000)), players: {}, i: -1, phase: "lobby" };
const save = () => { S.at = Date.now(); try { localStorage.setItem("quiz-host", JSON.stringify(S)) } catch {} };
let answers = {}, qStart = 0, timer = null, online = {};

const ch = room(S.code);
const url = new URL("play.html?r=" + S.code, location.href).href;
$("#code").textContent = S.code; $("#url").textContent = url.replace(/^https?:\/\//, "");
QRCode.toCanvas($("#qr"), url, { width: 600, margin: 1, color: { dark: "#0b1730" } });

ch.on("presence", { event: "sync" }, () => {
  online = {};
  for (const [id, metas] of Object.entries(ch.presenceState())) if (id !== "host") online[id] = metas[0].nick;
  for (const [id, nick] of Object.entries(online)) S.players[id] ??= { nick, score: 0, streak: 0 };
  renderLobby(); $("#ptot").textContent = Object.keys(online).length;
});
ch.on("broadcast", { event: "hello" }, () => broadcast());
ch.on("broadcast", { event: "answer" }, ({ payload: a }) => {
  if (S.phase !== "question" || a.i !== S.i || answers[a.id] || !(a.choice >= 0 && a.choice < 4)) return;
  S.players[a.id] ??= { nick: String(a.nick || "?").slice(0, 16), score: 0, streak: 0 };
  answers[a.id] = { choice: a.choice, ms: Date.now() - qStart };
  $("#acount").textContent = Object.keys(answers).length;
  blip(660, .05);
  if (Object.keys(answers).length >= Object.keys(online).length) reveal();
});
ch.subscribe((s) => { $("#status").textContent = s === "SUBSCRIBED" ? "Online" : "Collegamento…"; if (s === "SUBSCRIBED") { ch.track({ nick: "host" }); broadcast(); } });

function show(id) { for (const s of document.querySelectorAll("main > section")) s.classList.toggle("hidden", s.id !== id); }
function broadcast(extra = {}) {
  const q = QUESTIONS[S.i];
  const msg = { phase: S.phase, i: S.i, n: QUESTIONS.length, ...extra };
  if (S.phase === "question") Object.assign(msg, { text: q.text, options: q.options, dur: SECONDS * 1000, remaining: Math.max(0, SECONDS * 1000 - (Date.now() - qStart)) });
  if (S.phase === "reveal" || S.phase === "board" || S.phase === "end") Object.assign(msg, { correct: q?.correct, results: S.results, ranks: ranks() });
  ch.send({ type: "broadcast", event: "state", payload: msg });
}
const ranked = () => Object.entries(S.players).sort((a, b) => b[1].score - a[1].score);
const ranks = () => Object.fromEntries(ranked().map(([id], k) => [id, k + 1]));

function renderLobby() {
  const ids = Object.keys(online);
  $("#pcount").textContent = ids.length;
  const box = $("#chips"), have = new Set([...box.children].map((c) => c.dataset.id));
  for (const id of ids) if (!have.has(id)) { const c = document.createElement("span"); c.className = "chip"; c.dataset.id = id; c.textContent = online[id]; box.append(c); blip(880, .04); }
  for (const c of [...box.children]) if (!online[c.dataset.id]) c.remove();
}

function ask() {
  S.i++; S.phase = "question"; answers = {}; S.results = {}; qStart = Date.now(); save();
  const q = QUESTIONS[S.i];
  $("#qtext").textContent = `${S.i + 1}/${QUESTIONS.length} · ${q.text}`;
  $("#qgrid").innerHTML = q.options.map((o, k) => `<div class="opt" data-i="${k}">${shape(k)}<span>${esc(o)}</span></div>`).join("");
  $("#acount").textContent = 0; show("question"); broadcast();
  const arc = $("#arc"), ring = $("#ring");
  clearInterval(timer);
  timer = setInterval(() => {
    const left = Math.max(0, SECONDS * 1000 - (Date.now() - qStart)), s = Math.ceil(left / 1000);
    if ($("#secs").textContent != s) { $("#secs").textContent = s; if (s <= 5 && s > 0) blip(440, .06); }
    arc.style.strokeDashoffset = 276.5 * (1 - left / (SECONDS * 1000));
    ring.classList.toggle("low", s <= 5);
    if (left <= 0) reveal();
  }, 100);
}

function reveal() {
  if (S.phase !== "question") return;
  clearInterval(timer); S.phase = "reveal";
  const q = QUESTIONS[S.i], counts = [0, 0, 0, 0], total = Object.keys(answers).length || 1;
  for (const [id, p] of Object.entries(S.players)) {
    const a = answers[id];
    if (a) counts[a.choice]++;
    const ok = a && a.choice === q.correct;
    // Stile Kahoot: 500-1000 punti in base alla velocità, +100 per ogni risposta giusta di fila (max +300)
    p.streak = ok ? p.streak + 1 : 0;
    const gained = ok ? Math.round(1000 - 500 * Math.min(1, a.ms / (SECONDS * 1000))) + Math.min(300, 100 * (p.streak - 1)) : 0;
    p.score += gained; p.gained = gained;
    S.results[id] = { ok: !!ok, answered: !!a, gained, score: p.score, streak: p.streak };
  }
  save();
  $("#rtext").textContent = q.text;
  $("#rgrid").innerHTML = q.options.map((o, k) => `<div class="opt ${k === q.correct ? "right" : "wrong"}" data-i="${k}">${shape(k)}<span>${esc(o)}</span><span class="n">${counts[k]}</span><span class="bar"></span></div>`).join("");
  $("#why").innerHTML = `<b>Perché?</b> ${esc(q.why)}<small>${esc(q.src)}</small>`;
  show("reveal"); broadcast();
  requestAnimationFrame(() => document.querySelectorAll("#rgrid .bar").forEach((b, k) => (b.style.width = (100 * counts[k] / total) + "%")));
  const right = counts[q.correct] / total;
  burst(right > .5 ? 1 : .5); chord();
}

function board() {
  S.phase = S.i === QUESTIONS.length - 1 ? "end" : "board"; save();
  if (S.phase === "end") return podium();
  const list = ranked().slice(0, 6), max = list[0]?.[1].score || 1;
  $("#btitle").textContent = `Classifica dopo ${S.i + 1} ${S.i ? "domande" : "domanda"}`;
  $("#rows").innerHTML = list.map(([id, p], k) => `<div class="row" style="animation-delay:${k * .08}s"><span class="fill" data-w="${100 * p.score / max}"></span><span class="rk">${k + 1}</span><span>${esc(p.nick)}</span><span>${p.streak > 1 ? `<span class="streak">serie ×${p.streak}</span>` : ""} ${p.gained ? `<span class="gain">+${p.gained}</span>` : ""}</span><span>${p.score}</span></div>`).join("") || `<p style="color:var(--soft)">Ancora nessun giocatore</p>`;
  $("#next").textContent = S.i === QUESTIONS.length - 2 ? "Ultima domanda" : "Prossima domanda";
  show("board"); broadcast();
  setTimeout(() => document.querySelectorAll(".row .fill").forEach((f) => (f.style.width = f.dataset.w + "%")), 100);
}

function podium() {
  const top = ranked().slice(0, 3), order = [1, 0, 2];
  $("#podium").innerHTML = order.filter((k) => top[k]).map((k) => `<div class="step s${k + 1}"><div class="name">${esc(top[k][1].nick)}</div><div class="pts">${top[k][1].score} punti</div><div class="block">${k + 1}</div></div>`).join("");
  show("end"); broadcast(); fanfare();
  setTimeout(() => { const end = Date.now() + 4000; (function f() { confetti({ particleCount: 6, angle: 60, spread: 70, origin: { x: 0 } }); confetti({ particleCount: 6, angle: 120, spread: 70, origin: { x: 1 } }); if (Date.now() < end) requestAnimationFrame(f); })(); }, 1500);
}

function burst(power) {
  const o = { particleCount: Math.round(140 * power), spread: 90, startVelocity: 55, colors: ["#f59e0b", "#22c55e", "#ffffff", "#2f7bf6"] };
  confetti({ ...o, angle: 60, origin: { x: 0, y: .8 } }); confetti({ ...o, angle: 120, origin: { x: 1, y: .8 } });
}

// Suoni brevi con Web Audio (M = muto)
let ac, muted = false;
function blip(f, d) { if (muted) return; ac ??= new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.type = "triangle"; g.gain.setValueAtTime(.15, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d * 4); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d * 4); }
const chord = () => [523, 659, 784].forEach((f, k) => setTimeout(() => blip(f, .12), k * 90));
const fanfare = () => [523, 659, 784, 1047, 784, 1047].forEach((f, k) => setTimeout(() => blip(f, .14), k * 150));

function next() {
  if (S.phase === "lobby" || S.phase === "board") ask();
  else if (S.phase === "question") reveal();
  else if (S.phase === "reveal") board();
}
$("#start").onclick = $("#next").onclick = next; $("#toBoard").onclick = board;
addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); next(); }
  if (e.key === "m" || e.key === "M") muted = !muted;
  if (e.key === "R" && e.shiftKey && confirm("Nuova partita? I punteggi vengono azzerati.")) { localStorage.removeItem("quiz-host"); location.reload(); }
});

// Ripresa dopo refresh
if (S.phase === "question") { S.i--; ask(); }
else if (S.phase === "reveal") board();
else if (S.phase === "board") board();
else if (S.phase === "end") podium();
</script>
</body>
</html>
