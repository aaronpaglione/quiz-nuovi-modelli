<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>Gioca · Nuovi Modelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  main { min-height: 100vh; min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--soft); font-weight: 700; }
  .bar b { color: #fff; font-family: "Space Grotesk"; font-size: 18px; }
  section { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  h1 { font-size: 34px; line-height: 1.05; }
  p.soft { color: var(--soft); font-size: 17px; line-height: 1.4; }
  label { font-weight: 700; font-size: 15px; color: var(--soft); }
  input { font: 700 22px "Inter"; padding: 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #fff; width: 100%; }
  input:focus { outline: none; border-color: var(--amber); }
  .btn { background: var(--amber); color: #1a1205; font-weight: 800; font-size: 20px; padding: 18px; border-radius: 14px; min-height: 56px; }
  .btn:disabled { opacity: .5; }
  .err { color: #fca5a5; font-size: 15px; min-height: 1em; }
  .big { font: 700 64px "Space Grotesk"; text-align: center; }
  .center { text-align: center; }
  .pulse { width: 90px; height: 90px; border-radius: 50%; background: var(--amber); margin: 0 auto; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.75); opacity: .5 } }

  #question { justify-content: flex-start; padding-top: 8px; }
  .qmini { font-size: 16px; line-height: 1.35; font-weight: 600; color: var(--soft); }
  .opts { display: grid; gap: 12px; flex: 1; }
  .opts .opt { font-size: 17px; padding: 16px; min-height: 76px; width: 100%; }
  .opts .opt:active { transform: scale(.97); }
  .tleft { height: 8px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .tleft i { display: block; height: 100%; background: var(--amber); width: 100%; transition: width .2s linear; }

  /* esito */
  #result { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 5; padding: 32px 20px; text-align: center; align-items: center; }
  #result.ok { background: radial-gradient(circle at 50% 30%, #2bd36d, #15803d 70%); }
  #result.ko { background: radial-gradient(circle at 50% 30%, #f87171, #991b1b 70%); }
  #result.ko .card { animation: shake .5s; }
  .card { animation: pop .5s ease-out; }
  .icon { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; margin: 0 auto 12px; font: 700 70px "Space Grotesk"; }
  .gained { font: 700 54px "Space Grotesk"; }
  .meta { font-size: 18px; font-weight: 700; opacity: .9; margin-top: 8px; }
  .chipline { display: inline-block; background: rgba(0,0,0,.25); padding: 8px 16px; border-radius: 99px; margin-top: 14px; font-weight: 800; }
  /* iPad e tablet: colonna centrata, risposte 2x2 grandi */
  @media (min-width: 700px) {
    main { max-width: 980px; margin: 0 auto; padding: 28px 32px; }
    h1 { font-size: 46px; } p.soft { font-size: 21px; } input, .btn { font-size: 24px; }
    #join { max-width: 560px; width: 100%; margin: 0 auto; }
    .qmini { font-size: 22px; color: #fff; }
    .opts { grid-template-columns: 1fr 1fr; }
    .opts .opt { font-size: 22px; min-height: 180px; padding: 24px; }
    .icon { width: 160px; height: 160px; font-size: 96px; } .gained { font-size: 80px; } .meta { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <div class="bar"><span id="me">Nuovi modelli · Quiz</span><b id="score"></b></div>

  <section id="join">
    <h1>Entra nella sfida</h1>
    <p class="soft">Scegli un nickname: sarà visibile a tutti sul proiettore.</p>
    <div id="codeRow"><label for="code">Codice partita</label><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    <label for="nick">Nickname</label>
    <input id="nick" maxlength="16" autocomplete="off" placeholder="es. Keynes97">
    <button class="btn" id="go">Entra</button>
    <div class="err" id="err" role="alert"></div>
  </section>

  <section id="wait" class="hidden center">
    <div class="pulse"></div>
    <h1 id="waitT">Sei dentro!</h1>
    <p class="soft" id="waitP">Guarda il proiettore: si parte tra poco.</p>
  </section>

  <section id="question" class="hidden">
    <div class="tleft"><i id="tbar"></i></div>
    <div class="qmini" id="qmini"></div>
    <div class="opts" id="opts"></div>
  </section>

  <section id="locked" class="hidden center">
    <div class="big" id="lockedShape"></div>
    <h1>Risposta bloccata</h1>
    <p class="soft">Vediamo se è quella giusta…</p>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <div class="icon" id="ricon"></div>
      <h1 id="rtitle"></h1>
      <div class="gained" id="rgain"></div>
      <div class="meta" id="rmeta"></div>
      <div class="chipline" id="rrank"></div>
    </div>
  </section>
</main>

<div id="fatal" class="err" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;background:#3b0d0d;padding:12px;border-radius:12px"></div>
<script>
window.onerror = function (msg) { var f = document.getElementById("fatal"); f.style.display = "block"; f.textContent = "Errore: " + msg + ". Ricarica la pagina; se continua usa un altro dispositivo."; };
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="config.global.js"></script>
<script>
// Pagina giocatore in JavaScript "classico" (niente moduli, niente sintassi recente): gira anche sugli iPad datati.
// Si collega a Supabase Realtime direttamente via WebSocket (protocollo Phoenix), senza la libreria supabase-js.
(function () {
  "use strict";
  var CFG = window.QUIZ_CFG, LETTERS = ["A", "B", "C", "D"];
  var SHAPES = ['<polygon points="50,8 95,90 5,90"/>', '<polygon points="50,4 96,50 50,96 4,50"/>', '<circle cx="50" cy="50" r="44"/>', '<rect x="10" y="10" width="80" height="80" rx="6"/>'];
  function shape(i) { return '<span class="shape" aria-hidden="true"><svg viewBox="0 0 100 100">' + SHAPES[i] + "</svg></span>"; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(s) { return document.querySelector(s); }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function fire(o) { try { if (window.confetti) window.confetti(o); } catch (e) {} }

  var id = get("quiz-id") || ("p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  set("quiz-id", id);
  var m = /[?&]r=(\d{4})/.exec(location.search), code = m ? m[1] : "";
  var ws = null, ref = 0, topic = "", hb = null, joined = false, gotState = false, nick = "", stateTimer = null;
  var st = {}, myChoice = null, tick = null, shownResult = -1;

  if (code) $("#codeRow").style.display = "none"; else $("#code").focus();
  $("#nick").value = get("quiz-nick") || "";

  function show(s) { var x = document.querySelectorAll("main > section"); for (var k = 0; k < x.length; k++) x[k].classList.toggle("hidden", x[k].id !== s); }
  function err(t) { $("#err").textContent = t; $("#go").disabled = false; }

  $("#go").onclick = join;
  $("#nick").onkeydown = function (e) { if (e.key === "Enter" || e.keyCode === 13) join(); };
  $("#code").onkeydown = function (e) { if (e.key === "Enter" || e.keyCode === 13) $("#nick").focus(); };

  function join() {
    var n = $("#nick").value.trim().replace(/\s+/g, " ").slice(0, 16);
    var c = code || $("#code").value.trim();
    if (!/^\d{4}$/.test(c)) return err("Il codice è di 4 cifre: lo trovi sul proiettore.");
    if (n.length < 2) return err("Scegli un nickname di almeno 2 caratteri.");
    if (!CFG || !window.WebSocket) return err("Questo browser non riesce a collegarsi. Prova a ricaricare.");
    nick = n; set("quiz-nick", n); $("#me").textContent = n; $("#err").textContent = "Mi collego…"; $("#go").disabled = true;
    if (ws && topic === "realtime:quiz-" + c) return hello();
    code = c; connect();
  }

  function send(event, payload, t) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ topic: t || topic, event: event, payload: payload, ref: String(++ref) })); }
  function hello() { send("broadcast", { type: "broadcast", event: "hello", payload: { id: id } }); }

  function connect() {
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
    topic = "realtime:quiz-" + code; joined = false; gotState = false;
    ws = new WebSocket(CFG.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(CFG.key) + "&vsn=1.0.0");
    ws.onopen = function () {
      send("phx_join", { config: { broadcast: { ack: false, self: false }, presence: { key: id }, postgres_changes: [], private: false }, access_token: CFG.key });
      clearInterval(hb); hb = setInterval(function () { send("heartbeat", {}, "phoenix"); }, 25000);
    };
    ws.onmessage = function (e) {
      var msg; try { msg = JSON.parse(e.data); } catch (x) { return; }
      if (msg.topic !== topic) return;
      if (msg.event === "phx_reply" && !joined && msg.payload && msg.payload.status === "ok") {
        joined = true;
        send("presence", { type: "presence", event: "track", payload: { nick: nick } });
        hello();
        clearTimeout(stateTimer);
        // Se il proiettore non risponde, il codice è sbagliato o la partita non è aperta
        stateTimer = setTimeout(function () { if (!gotState) { err("Partita " + code + " non trovata: controlla il codice sul proiettore."); code = /[?&]r=(\d{4})/.test(location.search) ? code : ""; $("#codeRow").style.display = ""; } }, 6000);
      } else if (msg.event === "phx_reply" && msg.payload && msg.payload.status === "error") {
        err("Connessione rifiutata. Ricarica la pagina e riprova.");
      } else if (msg.event === "broadcast" && msg.payload && msg.payload.event === "state") {
        if (!gotState) { gotState = true; $("#err").textContent = ""; }
        apply(msg.payload.payload);
      }
    };
    ws.onerror = function () {};
    ws.onclose = function () { clearInterval(hb); if (nick) setTimeout(connect, 1500); };
  }

  function apply(m) {
    st = m;
    var mine = m.results && m.results[id];
    if (mine) $("#score").textContent = mine.score + " pt";
    if (m.phase === "lobby") { $("#waitT").textContent = "Sei dentro!"; $("#waitP").textContent = "Guarda il proiettore: si parte tra poco."; $("#score").textContent = ""; myChoice = null; shownResult = -1; show("wait"); }
    else if (m.phase === "question") question(m);
    else if (m.phase === "reveal") result(m);
    else if (m.phase === "board") { var rk = m.ranks && m.ranks[id]; $("#waitT").textContent = rk ? "Sei " + rk + "°" : "Classifica"; $("#waitP").textContent = "Guarda il proiettore: arriva la prossima domanda."; show("wait"); }
    else if (m.phase === "end") end(m);
  }

  function question(m) {
    if (myChoice && myChoice.i === m.i) return show("locked");
    myChoice = null;
    $("#qmini").textContent = (m.i + 1) + "/" + m.n + " · " + m.text;
    var h = "";
    for (var k = 0; k < m.options.length; k++) h += '<button class="opt" data-i="' + k + '" aria-label="' + LETTERS[k] + ": " + esc(m.options[k]) + '">' + shape(k) + "<span>" + esc(m.options[k]) + "</span></button>";
    $("#opts").innerHTML = h;
    var bs = document.querySelectorAll("#opts .opt");
    for (var j = 0; j < bs.length; j++) bs[j].onclick = (function (choice) { return function () { answer(m.i, choice); }; })(j);
    var end = Date.now() + m.remaining, tot = m.dur || 25000;
    clearInterval(tick);
    tick = setInterval(function () { var left = Math.max(0, end - Date.now()); $("#tbar").style.width = (100 * left / tot) + "%"; if (!left) clearInterval(tick); }, 200);
    show("question");
  }

  function answer(i, choice) {
    if (myChoice) return;
    myChoice = { i: i, choice: choice };
    send("broadcast", { type: "broadcast", event: "answer", payload: { id: id, i: i, choice: choice, nick: nick } });
    vibrate(30);
    $("#lockedShape").innerHTML = '<div class="opt" data-i="' + choice + '" style="width:110px;height:110px;margin:0 auto;justify-content:center;font-size:64px">' + shape(choice) + "</div>";
    show("locked");
  }

  function result(m) {
    clearInterval(tick);
    if (shownResult === m.i) return; shownResult = m.i;
    var r = (m.results && m.results[id]) || { ok: false, answered: false, gained: 0, score: 0, streak: 0 }, sec = $("#result");
    sec.className = r.ok ? "ok" : "ko";
    $("#ricon").textContent = r.ok ? "✓" : "✗";
    $("#rtitle").textContent = r.ok ? (r.streak >= 3 ? "Inarrestabile!" : r.streak === 2 ? "Due di fila!" : "Esatto!") : r.answered ? "Sbagliato" : "Tempo scaduto";
    $("#rgain").textContent = r.ok ? "+0" : "";
    $("#rmeta").textContent = r.ok ? (r.streak > 1 ? "Serie ×" + r.streak + ": bonus velocità e serie" : "Bonus velocità incluso") : "La risposta giusta era " + LETTERS[m.correct];
    var rk = m.ranks && m.ranks[id];
    $("#rrank").textContent = rk ? "Sei " + rk + "° · " + r.score + " punti" : r.score + " punti";
    show("result");
    if (r.ok) {
      vibrate([60, 40, 120]); count($("#rgain"), r.gained);
      fire({ particleCount: 120, spread: 80, origin: { y: .35 }, colors: ["#ffffff", "#f59e0b", "#22c55e"] });
      setTimeout(function () { fire({ particleCount: 60, spread: 120, startVelocity: 35, origin: { y: .3 } }); }, 350);
    } else vibrate(250);
  }
  function count(el, to) { var t0 = Date.now(); (function f() { var k = Math.min(1, (Date.now() - t0) / 900); el.textContent = "+" + Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(); }

  function end(m) {
    var rk = m.ranks && m.ranks[id], score = m.results && m.results[id] ? m.results[id].score : 0;
    $("#waitT").textContent = rk ? (rk <= 3 ? "Podio! Sei " + rk + "°" : "Posizione finale: " + rk + "°") : "Fine!";
    $("#waitP").textContent = score + " punti. Grazie per aver giocato!";
    show("wait");
    if (rk && rk <= 3) fire({ particleCount: 200, spread: 100, origin: { y: .4 } });
  }
})();
</script>
</body>
</html>
